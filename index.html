<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rohit - Product Designer</title>
  <meta name="description" content="Portfolio of a creative generalist and product designer." />

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/"
      }
    }
    </script>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Instrument+Serif:ital,wght@0,400;1,400&family=Manrope:wght@200..800&family=Onest:wght@100..900&display=swap"
    rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background-color: #F4F4F4;
      color: #1a1a1a;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    .font-serif {
      font-family: 'Instrument Serif', serif;
    }

    .font-cursive {
      font-family: 'Dancing Script', cursive;
    }

    .font-onest {
      font-family: 'Onest', sans-serif;
    }

    /* Custom smooth scrollbar for overflow containers */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
